{% extends "base.html" %}
{% block title %}项目总览 · AI 小说工作台{% endblock %}
{% block content %}
<h1>项目总览</h1>
<section aria-labelledby="create-project-heading">
  <h2 id="create-project-heading">创建小说项目</h2>
  <form action="/projects" method="post">
    <p><label for="title">项目名称</label><input id="title" name="title" value="{{ project_form.title }}" required></p>
    <p><label for="target_chars_min">目标字数下限</label><input id="target_chars_min" name="target_chars_min" type="number" min="1" value="{{ project_form.target_chars_min }}" required></p>
    <p><label for="target_chars_max">目标字数上限</label><input id="target_chars_max" name="target_chars_max" type="number" min="1" value="{{ project_form.target_chars_max }}" required></p>
    <button type="submit">创建项目</button>
  </form>
</section>
<section aria-labelledby="projects-heading">
  <h2 id="projects-heading">现有项目</h2>
  {% if projects %}<ul>{% for project in projects %}<li><a href="/projects/{{ project.id }}">{{ project.title }}</a></li>{% endfor %}</ul>{% else %}<p>暂无项目</p>{% endif %}
</section>
{% endblock %}
