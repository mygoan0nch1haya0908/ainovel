{% macro reading_panel(title, text) -%}
<details class="reading-panel" data-reading-panel>
  <summary>{{ title }} <span class="reading-count">{{ text|length }} 字符 · 点击展开 / 收起</span><span class="reading-preview">{{ text|truncate(85, true) }}</span></summary>
  <div class="chapter-body">{{ text }}</div>
</details>
{%- endmacro %}
{% macro reading_controls() -%}
<div class="reading-controls"><button type="button" class="secondary" data-disclosure-action="expand" hidden>全部展开</button><button type="button" class="secondary" data-disclosure-action="collapse" hidden>全部收起</button></div>
{%- endmacro %}
