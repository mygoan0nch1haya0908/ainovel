[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ainovel"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=3.8,<4",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
  "build>=1.3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "setuptools>=75",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ainovel = ["static/*.js", "web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --basetemp=.pytest-tmp"
markers = [
  "local_model: opt-in tests that call a model installed on the local loopback service",
]
